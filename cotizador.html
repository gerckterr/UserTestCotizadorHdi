<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotiza tu seguro de auto — HDI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EAEAEA;font-family:Nunito,sans-serif;color:#333333;-webkit-font-smoothing:antialiased}
a{color:#1F8A3B;text-decoration:none}
a:hover{color:#0F7B33;text-decoration:underline}
input,select,button,textarea{font-family:inherit}
select{-webkit-appearance:none;appearance:none}
input::placeholder{color:#ADADAD}
@keyframes scin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes scan{0%{top:6%}100%{top:88%}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
.h1{font-family:Inter,sans-serif;font-weight:800;font-size:40px;line-height:1.04;letter-spacing:-.025em;margin:0;color:#333;text-wrap:pretty}
.sub{font-family:Nunito;font-size:15px;line-height:1.4;color:#4A4A4A;margin:8px 0 0}
.btn{transition:filter .16s ease,transform .1s ease,background .16s ease;cursor:pointer;border:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:#C3E1A2!important;color:#FFFFFF!important;cursor:not-allowed;filter:none;border-color:#C3E1A2!important}
.card{transition:box-shadow .18s ease,border-color .18s ease}
.opt:hover{box-shadow:0 6px 20px rgba(0,0,0,.09)}
.lnk{cursor:pointer}
.fw input:focus,.fw select:focus{border-color:#76B82A!important}
.fw[data-filled="true"] input,.fw[data-filled="true"] select{border-color:#76B82A!important}
.fw[data-filled="true"] .ic svg{stroke:#76B82A!important}
.fw[data-err="true"] input,.fw[data-err="true"] select{border-color:#E2003C!important;color:#E2003C!important}
.fw[data-err="true"] .ic svg{stroke:#E2003C!important}
.fw[data-dis="true"] input,.fw[data-dis="true"] select{background:#D5D5D5!important;border-color:#D5D5D5!important;color:#8A8A8A!important}
.fw[data-dis="true"] .ic svg{stroke:#A5A5A5!important}
.dig{transition:border-color .15s ease,color .15s ease}
.dig:focus{border-color:#76B82A!important;color:#76B82A!important}
.dig[data-filled="true"]{border-color:#76B82A!important;color:#76B82A!important}
.dgroup[data-err="true"] .dig{border-color:#E2003C!important;color:#E2003C!important}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;background:#C2C2C2;color:#FFFFFF;border:none;font-family:Nunito;font-weight:700;font-size:12px;transition:background .2s ease}
.pill[data-st="done"],.pill[data-st="active"]{background:#76B82A}
.pcard[data-sel="true"]{border-color:#76B82A!important;box-shadow:0 2px 10px rgba(118,184,42,.14)}
.cell[data-on="false"]{color:#BDBDBD}
.only-d{display:none}
.side{display:flex;flex-direction:column}
.stepper{display:flex;flex-direction:row;align-items:center;gap:0}
.conn{background:#C2C2C2}
.ph-box{background:#F2F2F2;border:1.5px dashed #C9C9C9;display:flex;align-items:center;justify-content:center;color:#9E9E9E;font-family:Nunito;font-size:12px;text-align:center;padding:8px}
@media(max-width:899px){
 .promo[data-m="0"]{display:none!important}
 .pill{width:38px;height:38px;padding:0;border-radius:19px;flex:none}
 .pill[data-st="active"]{width:auto;padding:0 14px 0 12px;gap:6px}
 .pill .plabel{display:none}
 .pill[data-st="active"] .plabel{display:inline}
 .conn{width:8px;height:1.5px;margin:0 4px;flex:none}
 .shell{display:flex;flex-direction:column;gap:18px;padding:18px 20px 72px;max-width:640px;margin:0 auto}
 .grid2,.grid3,.grid2n{display:flex;flex-direction:column;gap:16px}
 .half{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media(min-width:900px){
 .only-d{display:block}
 .only-m{display:none!important}
 .h1{font-size:48px;line-height:1.02}
 .stepper{flex-direction:column;align-items:stretch;gap:0}
 .pill{width:100%;height:36px;border-radius:18px;font-size:13px}
 .conn{width:1.5px;height:12px;margin:0 auto;flex:none}
 .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:60px;max-width:1220px;margin:0 auto;padding:44px 24px 90px;align-items:start}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
 .grid2n{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
 .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
 .half{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .lastrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
}
</style>
</head>
<body>
<div id="screenRoot" data-screen="landing" data-sig="" style="min-height:100vh;background:#EAEAEA;display:flex;flex-direction:column"></div>
<script>
// ============================================================================
// Cotizador de seguro de auto — prototipo autocontenido (vanilla JS).
// Puerto de design/Cotizador Auto.dc.html, sin el runtime de diseño.
// Notifica a la ventana padre (el test) cada vez que cambia de pantalla,
// vía postMessage, y además deja el atributo data-screen como respaldo.
// ============================================================================

const MODELOS = {
  'Nissan Versa': { f: 1.00, v: ['SENSE, L4, 1.6L, 106 CP, 5 PUERTAS, STD', 'ADVANCE, L4, 1.6L, 106 CP, 5 PUERTAS, STD', 'ADVANCE, L4, 1.6L, 106 CP, 5 PUERTAS, CVT', 'EXCLUSIVE, L4, 1.6L, 106 CP, 5 PUERTAS, CVT'] },
  'Nissan March': { f: 0.88, v: ['SENSE, L4, 1.6L, 106 CP, 5 PUERTAS, STD', 'ADVANCE, L4, 1.6L, 106 CP, 5 PUERTAS, CVT', 'SR, L4, 1.6L, 106 CP, 5 PUERTAS, CVT'] },
  'Chevrolet Aveo': { f: 0.90, v: ['LS, L4, 1.5L, 107 CP, 4 PUERTAS, STD', 'LT, L4, 1.5L, 107 CP, 4 PUERTAS, AUT', 'PREMIER, L4, 1.5L, 107 CP, 4 PUERTAS, AUT'] },
  'Volkswagen Jetta': { f: 1.18, v: ['TRENDLINE, L4, 1.4L, 150 CP, 4 PUERTAS, STD', 'COMFORTLINE, L4, 1.4L, 150 CP, 4 PUERTAS, AUT', 'HIGHLINE, L4, 1.4L, 150 CP, 4 PUERTAS, AUT'] },
  'KIA Rio': { f: 0.95, v: ['LX, L4, 1.6L, 121 CP, 4 PUERTAS, STD', 'EX, L4, 1.6L, 121 CP, 4 PUERTAS, AUT', 'EX PACK, L4, 1.6L, 121 CP, 5 PUERTAS, AUT'] },
  'Toyota Corolla': { f: 1.22, v: ['BASE, L4, 1.8L, 139 CP, 4 PUERTAS, CVT', 'LE, L4, 1.8L, 139 CP, 4 PUERTAS, CVT', 'SE, L4, 2.0L, 169 CP, 4 PUERTAS, CVT'] },
  'Honda City': { f: 1.12, v: ['UNIQUE, L4, 1.5L, 119 CP, 4 PUERTAS, STD', 'PRIME, L4, 1.5L, 119 CP, 4 PUERTAS, CVT', 'TOURING, L4, 1.5L, 119 CP, 4 PUERTAS, CVT'] },
  'Mazda 3': { f: 1.30, v: ['I, L4, 2.0L, 155 CP, 4 PUERTAS, STD', 'I GRAND TOURING, L4, 2.5L, 186 CP, 4 PUERTAS, AUT', 'S GRAND TOURING, L4, 2.5L, 186 CP, 5 PUERTAS, AUT'] }
};
const BASE = { rc: 7800, lim: 11760, amp: 17400 };
const ITEMS = {
  rc: ['Responsabilidad Civil (R.C.) Daños a Terceros', 'Asistencia Jurídica'],
  lim: ['Responsabilidad Civil (R.C.) Daños a Terceros', 'Asistencia Jurídica', 'Robo Total', 'Gastos Médicos Ocupantes'],
  amp: ['Gastos Médicos Ocupantes', 'Responsabilidad Civil (R.C.) Daños a Terceros', 'Extensión de R.C.', 'Asistencia Jurídica', 'Daños Materiales', 'Robo Total']
};
const COVS = [
  { k: 'rc', n: 'R.C.', d: 'Cobertura básica', rec: false },
  { k: 'lim', n: 'Limitada', d: 'Cobertura limitada', rec: false },
  { k: 'amp', n: 'Amplia', d: 'Cobertura completa', rec: true }
];
const ALL_ITEMS = ['Responsabilidad Civil (R.C.) Daños a Terceros', 'Asistencia Jurídica', 'Robo Total', 'Gastos Médicos Ocupantes', 'Extensión de R.C.', 'Daños Materiales'];
const CPMAP = { '37000': { c: 'Del Valle', m: 'Guanajuato' }, '06700': { c: 'Roma Norte', m: 'Cuauhtémoc' }, '44100': { c: 'Centro', m: 'Guadalajara' }, '64000': { c: 'Centro', m: 'Monterrey' }, '20000': { c: 'Centro', m: 'Aguascalientes' } };
const FREQS = [{ k: 'mensual', n: 'Mensual' }, { k: 'trimestral', n: 'Trimestral' }, { k: 'anual', n: 'Anual' }];
const STEP_OF = { auto: 1, help: 1, llamar: 1, marcamos: 1, llamamos: 1, contacto: 2, plan: 3, identidad: 4, ine: 4, datos: 4, poliza: 5, pago: 6 };

let state = {
  screen: 'landing',
  nombre: '', cp: ['', '', '', '', ''], marca: '', anio: '', version: '',
  verLoading: false, versiones: [],
  email: '', tel: '', acepto: false, otpSent: false, sending: false,
  otp: ['', '', '', '', '', ''], otpErr: false, otpShake: 0, resendLeft: 30,
  telL: '', telLDone: '',
  cobertura: 'amp', freq: 'mensual', promo: false, promoLoading: false, expandCov: false, compare: false,
  identMode: null,
  d: { nombre: '', apellidos: '', fecha: '', calle: '', colonia: '', municipio: '', numext: '', numint: '' },
  niv: '', rfc: '', factura: false,
  card: '', exp: '', cvv: '', paying: false, payError: false,
  err: {}, helpOpen: false, toast: ''
};
let versionesTimer = null;
let resendTimer = null;
let lastPostedSig = null;

// --- helpers ---
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function digits(s) { return (s || '').replace(/\D/g, ''); }
function fmt2(n) { return Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmt0(n) { return Math.round(Number(n)).toLocaleString('es-MX'); }

function money() {
  const f = (MODELOS[state.marca] || { f: 1 }).f;
  const annual = Math.round(BASE[state.cobertura] * f);
  const per = { mensual: 1, trimestral: 0.97 / 4, anual: 0.85 }[state.freq];
  let amt = Math.round(state.freq === 'mensual' ? annual / 12 : annual * per);
  const amtBase = amt;
  if (state.promo) amt = Math.round(amt * 0.9);
  const after = { mensual: 11, trimestral: 3, anual: 0 }[state.freq];
  const totalBase = annual;
  const totalFinal = state.promo ? Math.round(annual * 0.9) : annual;
  return {
    annual, amt, amtBase, after,
    unit: { mensual: '/mes', trimestral: '/trimestre', anual: '/año' }[state.freq],
    months: { mensual: 1, trimestral: 3, anual: 12 }[state.freq],
    ahorroAnual: annual - Math.round(annual * 0.85),
    ahorroPromo: Math.round(annual * 0.1),
    totalBase, totalFinal
  };
}
function cardMonthly(k) {
  const f = (MODELOS[state.marca] || { f: 1 }).f;
  const annual = Math.round(BASE[k] * f);
  const per = { mensual: 1, trimestral: 0.97 / 4, anual: 0.85 }[state.freq];
  const amt = Math.round(state.freq === 'mensual' ? annual / 12 : annual * per);
  const months = { mensual: 1, trimestral: 3, anual: 12 }[state.freq];
  return Math.round(amt / months);
}
function genRfc() {
  const ap = (state.d.apellidos || '').trim().toUpperCase().replace(/[^A-ZÑ ]/g, '');
  const no = (state.d.nombre || '').trim().toUpperCase().replace(/[^A-ZÑ ]/g, '');
  const p = ap.split(/\s+/)[0] || 'XXXX';
  const vow = (p.slice(1).match(/[AEIOU]/) || ['X'])[0];
  const f = digits(state.d.fecha);
  const yy = f.slice(4, 8).slice(2) || '00', mm = f.slice(2, 4) || '00', dd = f.slice(0, 2) || '00';
  return (p.slice(0, 2) + vow + (no[0] || 'X') + yy + mm + dd + 'HD1').slice(0, 13);
}
function clearErr(k) { if (state.err[k]) delete state.err[k]; }
function loadVersiones() {
  const m = state.marca, a = state.anio;
  if (!m || !a) { state.versiones = []; state.version = ''; state.verLoading = false; return; }
  state.verLoading = true; state.versiones = []; state.version = '';
  if (versionesTimer) clearTimeout(versionesTimer);
  versionesTimer = setTimeout(() => { state.verLoading = false; state.versiones = (MODELOS[m] || { v: [] }).v; render(); }, 750);
}
function showToast(msg, ms) {
  state.toast = msg; render();
  setTimeout(() => { state.toast = ''; render(); }, ms || 2400);
}

function nav(screen) {
  state.screen = screen;
  state.err = {};
  render();
  window.scrollTo(0, 0);
}

function postScreenIfChanged() {
  const sig = [state.screen, state.cobertura, state.freq, state.promo ? 1 : 0].join('|');
  if (sig === lastPostedSig) return;
  lastPostedSig = sig;
  try {
    window.parent.postMessage({ type: 'screen', screen: state.screen, sig: sig }, '*');
  } catch (e) {}
}

// --- iconos reutilizados (SVG inline, copiados del prototipo) ---
const ICON_CAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8CC44A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h18l-1.4-4.2A2 2 0 0 0 17.7 7H6.3a2 2 0 0 0-1.9 1.8L3 13z"></path><path d="M3 13v4h18v-4"></path><circle cx="7" cy="17" r="1.5"></circle><circle cx="17" cy="17" r="1.5"></circle></svg>';
const ICON_SHIELD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8CC44A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"></path></svg>';
const ICON_CARD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8CC44A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"></rect><path d="M2.5 10h19"></path></svg>';
const ICON_ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#76B82A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>';
const ICON_CHEVRON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A5A5A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg>';
const ICON_WA = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F8A3B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.8A8 8 0 0 1 8.6 19L4 20l1.1-4.4A8 8 0 1 1 20 11.8z"></path></svg>';
const ICON_PHONE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F8A3B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 3.5h2.2l1.4 3.4-1.8 1.3a11 11 0 0 0 5.4 5.4l1.3-1.8 3.4 1.4v2.2c0 1.1-.9 2-2 2A14.5 14.5 0 0 1 4.6 5.5c0-1.1.9-2 2-2z"></path></svg>';
const ICON_CLOCK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F8A3B" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>';
const ICON_USER = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A5A5A5" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.2"></circle><path d="M5.5 20c1-3.2 3.6-5 6.5-5s5.5 1.8 6.5 5"></path></svg>';
const ICON_CHECK_CIRCLE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#76B82A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"></circle><path d="M8 12.2l2.6 2.6L16.2 9"></path></svg>';
const ICON_CLOSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';

function ph(label, extraStyle) {
  return '<div class="ph-box" style="' + (extraStyle || '') + '">' + esc(label) + '</div>';
}

// ----------------------------------------------------------------------------
// Render
// ----------------------------------------------------------------------------

function fieldWrap(opts) {
  // opts: {label, req, filled, err, dis, id, input, errMsg, note}
  return '<div class="fw" data-filled="' + (opts.filled ? 'true' : 'false') + '" data-err="' + (opts.err ? 'true' : 'false') + '"' + (opts.dis ? ' data-dis="true"' : '') + ' style="display:flex;flex-direction:column;gap:6px">' +
    '<label style="font-family:Nunito;font-size:13px;font-weight:700;color:#333">' + opts.label + (opts.req !== false ? ' <span style="color:#E2003C">*</span>' : '') + '</label>' +
    '<div style="position:relative">' + opts.input + '</div>' +
    (opts.note || '') +
    (opts.err && opts.errMsg ? '<div style="font-family:Nunito;font-size:12px;color:#E2003C">' + opts.errMsg + '</div>' : '') +
    '</div>';
}

function renderHeader() {
  return '<header style="background:#F7F7F7;border-bottom:1px solid #E3E3E3;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40">' +
    '<div data-action="goHome" class="lnk" style="display:flex;align-items:center"><img src="./logohdi.png" alt="HDI Seguros" style="height:38px;width:auto;display:block"></div>' +
    '<button type="button" data-action="openHelp" class="btn" style="background:none;font-family:Nunito;font-size:15px;color:#5A5A5A">¿Necesitas ayuda?</button>' +
    '</header>';
}

function renderPromo() {
  const onMobile = state.screen === 'landing' || state.screen === 'plan';
  return '<div class="promo" data-m="' + (onMobile ? '1' : '0') + '" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:linear-gradient(102deg,#0B6B2E 0%,#0B6B2E 60%,#3F9A3F 60.15%,#3F9A3F 100%);position:relative;overflow:hidden">' +
    '<div style="display:flex;align-items:center;gap:12px;min-width:0">' +
    '<div style="width:44px;height:44px;border-radius:22px;flex:none;background:#8CC44A;display:flex;align-items:center;justify-content:center;font-size:20px">🐾</div>' +
    '<div style="min-width:0">' +
    '<div style="font-family:Nunito;font-weight:800;font-size:17px;color:#FFFFFF;line-height:1.1">Mundial 2026</div>' +
    '<div style="font-family:Nunito;font-weight:700;font-size:12px;color:#FFFFFF;line-height:1.3">10% OFF + 12 Meses sin intereses</div>' +
    '<div style="font-family:Nunito;font-size:11px;color:#CFE8CF;line-height:1.3;text-decoration:underline">Consulta términos y condiciones</div>' +
    '</div></div>' +
    '<div style="background:#FFFFFF;border-radius:8px;padding:6px 14px;text-align:center;flex:none">' +
    '<div style="font-family:Nunito;font-size:10px;color:#5A5A5A;line-height:1.2">Usa el código</div>' +
    '<div style="font-family:Nunito;font-weight:800;font-size:15px;color:#0F7B33;line-height:1.2">MUNDIAL2026</div>' +
    '</div></div>';
}

function renderLanding() {
  return '<main style="animation:scin .24s ease both;padding:20px 20px 70px;max-width:1220px;margin:0 auto;width:100%">' +
    '<div class="grid2n" style="align-items:center">' +
    '<div>' +
    '<div style="background:#76B82A;border-radius:14px;padding:34px 28px 30px">' +
    '<h1 class="h1" style="color:#FFFFFF">Cotiza tu seguro de auto</h1>' +
    '<div style="font-family:Nunito;font-weight:800;font-size:18px;color:#FFFFFF;margin-top:14px">Y contrata tu póliza 100% en línea.</div>' +
    '<div style="display:flex;flex-direction:column;gap:14px;margin-top:26px">' +
    landingBullet('<circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path>', 'Listo en 2 minutos', 'Sin llamadas, sin esperas.') +
    landingBullet('<rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5"></path>', '100% digital y seguro', 'Tus datos siempre protegidos.') +
    landingBullet('<path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5L14 3.5z"></path><path d="M14 3.5v5h5"></path>', 'Solo necesitas los datos de tu auto', 'Sin papeleo ni complicaciones.') +
    '</div>' +

  if (!state.helpOpen) return '';
  return '<div data-action="closeHelpBackdrop" style="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:95;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:scin .18s ease both">' +
    '<div style="background:#EAEAEA;border-radius:22px 22px 0 0;padding:22px 20px 32px;max-width:560px;width:100%">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-family:Nunito;font-weight:800;font-size:19px;color:#333">¿Necesitas ayuda?</span><button type="button" data-action="closeHelp" class="btn" style="background:none;padding:4px">' + ICON_CLOSE + '</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">' +
    helpOption(ICON_WA, 'Escríbenos por WhatsApp', 'Dile a un asesor qué vehículo es el que buscas.', null, 'https://wa.me/528000196000') +
    helpOption(ICON_PHONE, 'Llamar a un asesor', 'Lun a vie 8:00 - 20:00 | sáb 9:00 - 14:00', 'goLlamar') +
    helpOption(ICON_CLOCK, 'Que me llamen a mí', 'Nos dejas tu número y te marcamos.', 'goMarcamos') +
    '</div></div></div>';
}

function renderToast() {
  if (!state.toast) return '';
  return '<div style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#333;color:#fff;font-family:Nunito;font-weight:700;font-size:14px;padding:12px 20px;border-radius:24px;z-index:99;animation:scin .2s ease both">' + esc(state.toast) + '</div>';
}

function renderMain() {
  const s = state.screen;
  if (s === 'landing') return renderLanding();
  const inner =
    s === 'auto' ? renderAuto() :
    s === 'help' ? renderHelp() :
    s === 'llamar' ? renderLlamar() :
    s === 'marcamos' ? renderMarcamos() :
    s === 'llamamos' ? renderLlamamos() :
    s === 'contacto' ? renderContacto() :
    s === 'plan' ? renderPlan() :
    s === 'identidad' ? renderIdentidad() :
    s === 'ine' ? renderIne() :
    s === 'datos' ? renderDatos() :
    s === 'poliza' ? renderPoliza() :
    s === 'pago' ? renderPago() : '';
  return '<main class="shell">' + renderAside() + '<div style="min-width:0">' + inner + '</div></main>';
}

function render() {
  const sig = [state.cobertura, state.freq, state.promo ? 1 : 0, state.expandCov ? 1 : 0, state.compare ? 1 : 0].join('|');
  const root = $('screenRoot');
  root.setAttribute('data-screen', state.screen);
  root.setAttribute('data-sig', sig);
  const isListo = state.screen === 'listo';
  root.innerHTML = renderHeader() + renderPromo() + (isListo ? renderListo() : renderMain()) + renderCompareModal() + renderHelpModal() + renderToast();
  postScreenIfChanged();
}

// ----------------------------------------------------------------------------
// Eventos (delegación sobre el contenedor raíz)
// ----------------------------------------------------------------------------

const root = $('screenRoot');

root.addEventListener('click', ev => {
  const t = ev.target;
  const actionEl = t.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  const step = STEP_OF[state.screen] || 1;

  switch (action) {
    case 'goHome': nav('landing'); break;
    case 'openHelp': state.helpOpen = true; render(); break;
    case 'closeHelp': state.helpOpen = false; render(); break;
    case 'closeHelpBackdrop': if (t === actionEl) { state.helpOpen = false; render(); } break;
    case 'start': nav('auto'); break;
    case 'goStep': {
      const n = Number(actionEl.getAttribute('data-step'));
      const map = { 1: 'auto', 2: 'contacto', 3: 'plan', 4: 'identidad', 5: 'poliza' };
      if (n < 6 && step > n) nav(map[n]);
      break;
    }
    case 'back': {
      const map = { help: 'auto', llamar: 'help', marcamos: 'help', llamamos: 'marcamos', contacto: 'auto', plan: 'contacto', identidad: 'plan', ine: 'identidad', datos: 'identidad', poliza: 'datos', pago: 'poliza' };
      nav(map[state.screen] || 'auto');
      break;
    }
    case 'goAuto': nav('auto'); break;
    case 'goHelp': state.screen = 'help'; state.helpOpen = false; state.err = {}; render(); postScreenIfChanged(); break;
    case 'goLlamar': state.screen = 'llamar'; state.helpOpen = false; render(); postScreenIfChanged(); break;
    case 'goMarcamos': state.screen = 'marcamos'; state.helpOpen = false; render(); postScreenIfChanged(); break;

    case 'submitAuto': {
      const er = {};
      if (state.nombre.trim().split(/\s+/).filter(Boolean).length < 2) er.nombre = 1;
      if (state.cp.join('').length !== 5) er.cp = 1;
      if (!state.marca) er.marca = 1;
      if (!state.anio) er.anio = 1;
      if (!state.version) er.version = 1;
      state.err = er;
      if (!Object.keys(er).length) nav('contacto'); else render();
      break;
    }
    case 'solicitar': {
      if (digits(state.telL).length !== 10) { state.err = { telL: 1 }; render(); break; }
      state.telLDone = state.telL; state.screen = 'llamamos'; state.err = {}; render(); postScreenIfChanged();
      break;
    }
    case 'toggleAcepto': state.acepto = !state.acepto; clearErr('acepto'); render(); break;
    case 'sendOtp': {
      const er = {};
      if (!/.+@.+\..+/.test(state.email)) er.email = 1;
      if (digits(state.tel).length !== 10) er.tel = 1;
      if (!state.acepto) er.acepto = 1;
      state.err = er;
      if (Object.keys(er).length) { render(); break; }
      state.sending = true; render();
      setTimeout(() => { state.sending = false; state.otpSent = true; state.resendLeft = 30; state.otp = ['', '', '', '', '', '']; state.otpErr = false; render(); startResendTimer(); }, 1100);
      break;
    }
    case 'cambiarNumero': state.otpSent = false; state.otp = ['', '', '', '', '', '']; state.otpErr = false; render(); break;
    case 'resend': if (state.resendLeft <= 0) { state.resendLeft = 30; state.otp = ['', '', '', '', '', '']; state.otpErr = false; render(); startResendTimer(); showToast('Te enviamos un nuevo código por WhatsApp', 2600); } break;
    case 'confirmOtp': {
      const code = state.otp.join('');
      if (code === '000000') { state.otpErr = true; state.otpShake = Date.now(); render(); setTimeout(() => { state.otpShake = 0; render(); }, 400); break; }
      nav('plan');
      break;
    }

    case 'pickPlan': state.cobertura = actionEl.getAttribute('data-k'); render(); break;
    case 'toggleCov': ev.stopPropagation(); state.expandCov = !state.expandCov; render(); break;
    case 'pickFreq': state.freq = actionEl.getAttribute('data-k'); render(); break;
    case 'openCompare': state.compare = true; render(); break;
    case 'closeCompare': state.compare = false; render(); break;
    case 'closeCompareBackdrop': if (t === actionEl) { state.compare = false; render(); } break;
    case 'applyPromo': state.promoLoading = true; render(); setTimeout(() => { state.promoLoading = false; state.promo = true; render(); showToast('Descuento MUNDIAL2026 aplicado', 2400); }, 900); break;
    case 'removePromo': state.promo = false; render(); break;
    case 'toIdentidad': nav('identidad'); break;

    case 'scanIne': {
      state.identMode = 'ine'; state.screen = 'ine'; render(); postScreenIfChanged();
      setTimeout(() => {
        const parts = state.nombre.trim().split(/\s+/).filter(Boolean);
        const cpStr = state.cp.join('');
        const loc = CPMAP[cpStr] || { c: 'Del Valle', m: 'Guanajuato' };
        state.screen = 'datos';
        state.d = { nombre: parts[0] || '', apellidos: parts.slice(1).join(' '), fecha: '22/11/1994', calle: 'Av. Insurgentes', colonia: loc.c, municipio: loc.m, numext: '125', numint: 'A1' };
        render(); postScreenIfChanged();
      }, 2600);
      break;
    }
    case 'manualIne': state.identMode = 'manual'; state.screen = 'datos'; state.err = {}; render(); postScreenIfChanged(); break;
    case 'submitDatos': {
      const er = {}; const d = state.d;
      ['nombre', 'apellidos', 'fecha', 'calle', 'colonia', 'municipio', 'numext'].forEach(k => { if (!String(d[k] || '').trim()) er['d' + k] = 1; });
      if (d.fecha && !/^\d{2}\/\d{2}\/\d{4}$/.test(d.fecha)) er.dfecha = 1;
      state.err = er;
      if (Object.keys(er).length) { render(); break; }
      state.rfc = state.rfc || genRfc();
      state.screen = 'poliza'; state.err = {}; render(); postScreenIfChanged(); window.scrollTo(0, 0);
      break;
    }
    case 'toggleFactura': state.factura = !state.factura; render(); break;
    case 'submitPoliza': {
      const er = {};
      if (state.niv.length !== 17) er.niv = 1;
      if (state.rfc.length !== 13) er.rfc = 1;
      state.err = er;
      if (!Object.keys(er).length) nav('pago'); else render();
      break;
    }
    case 'pay': {
      const er = {};
      if (digits(state.card).length !== 16) er.card = 1;
      if (!/^\d{2}\/\d{2}$/.test(state.exp)) er.exp = 1;
      if (state.cvv.length !== 3) er.cvv = 1;
      state.err = er; state.payError = false;
      if (Object.keys(er).length) { render(); break; }
      state.paying = true; render();
      setTimeout(() => {
        if (digits(state.card).slice(-1) === '1') { state.paying = false; state.payError = true; render(); return; }
        state.paying = false; state.screen = 'listo'; render(); postScreenIfChanged(); window.scrollTo(0, 0);
      }, 2400);
      break;
    }
    case 'descargar':
      state.toast = 'Descargando tu póliza...'; render();
      setTimeout(() => { state.toast = 'Póliza descargada'; render(); setTimeout(() => { state.toast = ''; render(); }, 2000); }, 1400);
      break;
  }
});

root.addEventListener('input', ev => {
  const t = ev.target;
  const action = t.getAttribute('data-action');
  if (!action) return;
  switch (action) {
    case 'nombreInput': state.nombre = t.value; clearErr('nombre'); render(); restoreFocus(t); break;
    case 'marcaSelect': state.marca = t.value; clearErr('marca'); render(); setTimeout(loadVersiones, 0); break;
    case 'anioSelect': state.anio = t.value; clearErr('anio'); render(); setTimeout(loadVersiones, 0); break;
    case 'versionSelect': state.version = t.value; clearErr('version'); render(); break;
    case 'cpDigit': {
      const i = Number(t.getAttribute('data-i'));
      const v = digits(t.value).slice(0, 1);
      state.cp[i] = v; clearErr('cp'); render();
      if (v && i < 4) { const n = root.querySelectorAll('.dgroup .dig')[i + 1]; if (n) n.focus(); }
      break;
    }
    case 'telLInput': state.telL = digits(t.value).slice(0, 10); clearErr('telL'); render(); restoreFocus(t); break;
    case 'emailInput': state.email = t.value; clearErr('email'); render(); restoreFocus(t); break;
    case 'telInput': state.tel = digits(t.value).slice(0, 10); clearErr('tel'); render(); restoreFocus(t); break;
    case 'otpDigit': {
      const i = Number(t.getAttribute('data-i'));
      const v = digits(t.value).slice(0, 1);
      state.otp[i] = v; state.otpErr = false; render();
      if (v && i < 5) { const n = root.querySelectorAll('.dgroup .dig')[i + 1]; if (n) n.focus(); }
      break;
    }
    case 'dInput': { const f = t.getAttribute('data-field'); state.d[f] = t.value; clearErr('d' + f); render(); restoreFocus(t); break; }
    case 'dFechaInput': {
      const g = digits(t.value).slice(0, 8);
      let out = g.slice(0, 2); if (g.length > 2) out += '/' + g.slice(2, 4); if (g.length > 4) out += '/' + g.slice(4, 8);
      state.d.fecha = out; clearErr('dfecha'); render(); restoreFocus(t);
      break;
    }
    case 'nivInput': state.niv = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 17); clearErr('niv'); render(); restoreFocus(t); break;
    case 'rfcInput': state.rfc = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 13); clearErr('rfc'); render(); restoreFocus(t); break;
    case 'cardInput': { const g = digits(t.value).slice(0, 16); state.card = g.replace(/(.{4})/g, '$1 ').trim(); clearErr('card'); render(); restoreFocus(t); break; }
    case 'expInput': { const g = digits(t.value).slice(0, 4); state.exp = g.length > 2 ? g.slice(0, 2) + '/' + g.slice(2) : g; clearErr('exp'); render(); restoreFocus(t); break; }
    case 'cvvInput': state.cvv = digits(t.value).slice(0, 3); clearErr('cvv'); render(); restoreFocus(t); break;
  }
});

root.addEventListener('change', ev => {
  const t = ev.target;
  if (t.getAttribute('data-action') === 'freqSelect') { state.freq = t.value; render(); }
});

root.addEventListener('keydown', ev => {
  const t = ev.target;
  if (!(t.classList && t.classList.contains('dig'))) return;
  if (ev.key === 'Backspace' && !t.value) {
    const list = Array.prototype.slice.call(root.querySelectorAll('.dgroup .dig'));
    const i = list.indexOf(t);
    if (i > 0) list[i - 1].focus();
  }
});

// Restaura foco + posición del cursor tras un re-render disparado por un input de texto.
function restoreFocus(originalEl) {
  const action = originalEl.getAttribute('data-action');
  const field = originalEl.getAttribute('data-field');
  requestAnimationFrame(() => {
    let sel = '[data-action="' + action + '"]' + (field ? '[data-field="' + field + '"]' : '');
    const target = root.querySelector(sel);
    if (target) { target.focus(); const len = target.value.length; try { target.setSelectionRange(len, len); } catch (e) {} }
  });
}

function startResendTimer() {
  if (resendTimer) clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    if (state.otpSent && state.resendLeft > 0) { state.resendLeft--; render(); }
    else { clearInterval(resendTimer); }
  }, 1000);
}

render();
</script>

</html>
